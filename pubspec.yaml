name: news_shower
description: "News shower application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  get_it: ^9.3.0
  url_launcher: ^6.3.3
  cached_network_image: ^4.0.7
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_svg: ^2.4.0
  rxdart: ^0.28.0
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/ic_launcher_foreground.png
  adaptive_icon_monochrome: assets/icon/ic_launcher_monochrome.png
  adaptive_icon_foreground_inset: 16
